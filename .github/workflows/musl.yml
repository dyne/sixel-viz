name: Static Linux build and install

on: pull_request

permissions:
  contents: read

jobs:
  static-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dyne/musl-action@fe1d1871b096824ddb7aa158f68dd63dabdc9586
        id: musl
        with:
          target_arch: x86_64
          version: v2.11.0
          sha256: bf05a4be8edb63b309b388a1a6587d088ac4d0c1203fb4606d8887f50e112e01
      - name: Build, test and run the installed static viewer
        shell: bash
        env:
          CC: ${{ steps.musl.outputs.CC }}
          CXX: ${{ steps.musl.outputs.CXX }}
          SI_BUILD_JOBS: 4
        run: bash ci/musl-check.sh "$RUNNER_TEMP"
