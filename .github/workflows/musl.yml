name: Experimental static Linux build

on:
  push:
    branches: [ci/l5-musl]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dyne/musl-action@fe1d1871b096824ddb7aa158f68dd63dabdc9586
        id: musl
        with:
          target_arch: x86_64
          version: v2.9.0
          sha256: 99cafecdd1c07562ecc5213860e06c1d08d1e2dcfba55fffb4cc73450a950596
      - name: Try a static musl build of si
        env:
          CC: ${{ steps.musl.outputs.CC }}
          CXX: ${{ steps.musl.outputs.CXX }}
          SI_BUILD_JOBS: 4
        run: bash ci/musl-check.sh "$RUNNER_TEMP"
