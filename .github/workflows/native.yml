name: Native build and install

on: pull_request

permissions:
  contents: read

jobs:
  macos:
    name: macos installed media
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install macOS build tools and SVG provider
        run: brew install ccache jpeg-xl librsvg ninja pkgconf

      - uses: ./.github/actions/ccache
        with:
          target: macos-arm64

      - name: Build, run all tests, and check installed media
        run: bash ci/native-check.sh macos "$RUNNER_TEMP"
