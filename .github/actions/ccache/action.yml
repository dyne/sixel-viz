name: Restore compiler cache
description: Reuse ccache results between jobs for the same build target
inputs:
  target:
    description: Build target and toolchain cache namespace
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sixel-viz-ccache
        key: ccache-v1-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-v1-${{ inputs.target }}-
    - name: Configure ccache
      shell: bash
      env:
        CACHE_DIR: ${{ runner.temp }}/sixel-viz-ccache
      run: |
        printf '%s\n' "CCACHE_DIR=$CACHE_DIR" CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=256M >> "$GITHUB_ENV"
